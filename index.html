<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <meta name="description" content="Time tracking dashboard — Frontend Mentor challenge">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Time tracking dashboard</title>
  <script src="script.js" defer></script>
</head>

<body>

  <main class="container">

    <section class="card-profil">
      <div class="profil-content">
        <img class="img-profil" src="./images/image-jeremy.png" alt="Jeremy Robson" width="64" height="64">
        <div class="card-info">
          <p class="profil-paragraph">Report for</p>
          <h1 class="profil-title">Jeremy Robson</h1>
        </div>
      </div>

      <nav class="nav">
        <ul>
          <li class="box-btn-nav"><button class="nav-btn" type="button" data-period="daily">Daily</button></li>
          <li class="box-btn-nav"><button class="nav-btn active" type="button" data-period="weekly">Weekly</button></li>
          <li class="box-btn-nav"><button class="nav-btn" type="button" data-period="monthly">Monthly</button></li>
        </ul>
      </nav>
    </section>

    <div id="cards-container">

    </div>

  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Maxime Chapelle</a>.
  </footer>
</body>

</html>
